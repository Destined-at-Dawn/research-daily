## 第一步：安装引导——个人科研画像（首次运行必做）

> ⚠️ **首次使用本 Skill 时，AI 必须主动引导用户完成以下 4 个环节的问答。不得跳过。**
>
> 用户的回答构建"个人科研画像"，写入 `配置/领域关键词.md` 的"用户画像"节。
>
> **后续运行**：直接进入各 Workflow，不再重复画像。
> **更新画像**：用户说"更新我的画像"或"我方向变了"→ 重新触发。

### 环节 1️⃣：领域定位

**AI 引导话术**：

> "我们先做几个简单的设置，以后每天的科研日报和分析会更精准。
>
> **第一个问题：你的专业/研究方向是什么？**
>
> 可以告诉我你目前最核心的 1-3 个方向，比如：集成电路设计、电气工程、AI 算法……"

**追问**：
- "在这些方向里，有没有你最想重点追踪的细分领域？"
- "有没有你虽然不在那个领域、但想保持关注的方向？"

### 环节 2️⃣：文献基线

**AI 引导话术**：

> **"第二个问题：你最近读到过让你眼前一亮的论文吗？不用多，1-3 篇就行。为什么觉得它们好？"**
>
> 可以直接说标题，也可以把论文 PDF 或笔记的文件路径发给我。

**文件处理指令**（收到路径时自动执行）：
1. 读取文献文件（PDF/Markdown/TXT）
2. 提取论文信息
3. 分析用户的"好论文"共同特征
4. 编码为个性化评分权重

### 环节 3️⃣：阅读模式

**AI 引导话术**：

> **"第三个问题：你读一篇论文时，最关注哪个方面？**
>
> 选 1-2 个：
> - **方法创新**——新模型、新框架
> - **实验效果**——SOTA、大幅提升
> - **理论深度**——定理、证明、解释性
> - **工程价值**——开源代码、可复现
> - **应用前景**——落地可能性

### 环节 4️⃣：创新定位

**AI 引导话术**：

> **"最后一个问题：你现在在追踪哪些新方向？你觉得你的领域里最大的创新机会在哪里？"**
>
> 也可以告诉我：**有什么问题是你觉得'应该有人解决但一直没人解决'的？**

