## 执行流程

### Step 1：判断用户需求

```
用户输入
  │
  ├── 论文标题/DOI/PDF路径 → Workflow A（文献输入→全景分析）
  │
  ├── "生成今日日报" / 系统自动触发 → Workflow B（日报生成）
  │
  ├── "创新点是什么" / "还有什么可以做" → Workflow C（创新点发现）
  │
  ├── "对比这篇和那篇" / "我的和别人有什么不同" → Workflow C2-C3（文献对比）
  │
  ├── "这篇论文怎么写这么好" / "学写作" → Workflow D（写作心法）
  │
  └── "帮我规划" / "帮我审稿" → Workflow E（科研指导）
```

### Step 2-5：对应 Workflow 执行

