## Workflow C：创新点发现引擎

> **用户说："这篇论文的创新点是什么？" / "这个方向还有什么可以做？" / "帮我找研究空白"**

### C1：单篇论文创新点拆解

对任意输入论文进行七维创新解剖：

```markdown
## 🔬 创新点解剖报告

### 论文的核心信息
[标题/作者/期刊]

### 七维创新分析
| 维度 | 论文做了什么 | 现有研究的状态 | 创新程度 |
|------|------------|--------------|---------|
| ① 问题定义 | 解决什么问题 | 前人怎么做的 | 全新/改进/迁移 |
| ② 方法设计 | 用什么方法解决 | 常用方法是什么 | 颠覆/优化/组合 |
| ③ 理论框架 | 基于什么理论 | 已有理论是什么 | 新建/扩展/应用 |
| ④ 实验验证 | 怎么证明有效 | 前人怎么证明的 | 更全面/新指标 |
| ⑤ 数据资源 | 用了什么数据 | 之前用什么数据 | 新数据集/更大量 |
| ⑥ 应用场景 | 用在哪 | 之前用在哪儿 | 新领域/新任务 |
| ⑦ 性能表现 | 结果怎么样 | SOTA 是什么 | 大幅超越/持平 |

### 创新定位（按 Research Gap 分类）
□ **理论缺口**（Theory Gap）：现有理论无法解释的现象
□ **方法缺口**（Method Gap）：现有方法不够好或不适用
□ **应用缺口**（Application Gap）：已有方法没被用到某个领域
□ **数据缺口**（Data Gap）：缺少某类数据或某个场景的验证
□ **实证缺口**（Empirical Gap）：已有理论但缺实证支持
□ **人口/场景缺口**（Population Gap）：研究对象集中在某类群体

### 创新强度评估
- 🔴 颠覆性创新（开新方向）
- 🟡 改进性创新（做得更好）
- 🔵 组合性创新（跨领域迁移）
```

### C2：文献对比→发现创新空间

**你的论文 vs 已有文献**（用户说"我的想法和别人的有什么不同"）：

```markdown
## ⚔️ 对比分析：你的工作 vs 现有文献

### 差异化矩阵
| 对比维度 | 现有文献 A | 现有文献 B | 你的思路 | 差异化强度 |
|---------|-----------|-----------|---------|-----------|
| 核心假设 | ... | ... | ... | 高/中/低 |
| 方法选择 | ... | ... | ... | 高/中/低 |
| 实验设置 | ... | ... | ... | 高/中/低 |
| 数据来源 | ... | ... | ... | 高/中/低 |

### 创新空间识别
✅ **你可以做的方向**（按可行性排序）：
1. **[方向A]**：现有文献都在做X，但没有人做Y → 填补应用缺口
   - 可行性：高/中/低
   - 理由：[为什么可行]
2. **[方向B]**：文献A和文献B的方法冲突，你可以验证哪个对
   - 可行性：高/中/低

### 写作策略建议
- Introduction中如何定位你的差异化：
- Related Work中如何对比：
- 审稿人可能会问的问题：
```

**别人的论文 vs 别人的论文**（用户说"帮我对比这几篇论文"）：

```markdown
## 🔄 多篇文献对比分析

### 对比矩阵
| 论文 | 问题 | 方法 | 数据 | 结果 | 局限 |
|-----|------|------|------|------|------|
| [A] | ... | ... | ... | ... | ... |
| [B] | ... | ... | ... | ... | ... |
| [C] | ... | ... | ... | ... | ... |

### 趋势识别
- **共同点**：三篇都认为...
- **矛盾点**：A的结论和B的结论不一致...
- **盲区**：没有一篇关注到...
- **演进趋势**：从早期的...到现在的...

### 可发表的创新方向 🎯
1. **[方法合成]**：把A的方法 + C的数据 → 新任务
2. **[矛盾解决]**：做实验验证A和B的矛盾根源
3. **[盲区填补]**：在D场景复现ABC的方法
```

