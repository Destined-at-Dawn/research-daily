# 科研全流程工作台（v2.0）

> **每天 5 分钟，掌握前沿动态。**
> **输入一篇文献，输出一片天地。**

---

## 核心原则

### 原则一：输入即分析
用户输入任何文献信息（标题/DOI/PDF路径/笔记），AI 必须立即进行全景分析——不只是读取，而是自动关联领域内已有文献、定位其创新点、生成对比矩阵。

### 原则二：对比出创新
创新不是凭空想出来的，是比出来的。你的 vs 别人的（找差异化）、别人的 vs 别人的（找趋势与矛盾）、多篇横向对比（找空白）。每次对比都必须产出可操作的创新方向。

### 原则三：从文献到写作的完整闭环
不能"看了就忘"。每篇输入的文献必须走完：输入分析 → 纳入认知系统 → 提炼写作心法 → 可转化为论文材料。读完一篇文献，至少产出一个"可用"的东西。

