## Section 5: Workflow A — Paper Input -> Panoramic Analysis

### A1: Input Reception

| Input Type | Processing |
|-----------|-----------|
| Paper Title | Search arXiv + Google Scholar |
| DOI | Resolve DOI -> full metadata |
| arXiv ID | Fetch arXiv page |
| Local PDF | Read PDF -> extract title -> search |
| Text description | Extract keywords -> search |

### A2: Smart Retrieval

1. Extract key info from user input
2. Parallel search: arXiv API + local reading records + cached analyses
3. On service failure: see Section 1.2 fallback chain

### A3: Panoramic Card Output

```markdown
## Paper Panoramic Card

### Basic Info
- Title: [full title]
- Authors: [list]
- Venue: [journal/conference/arXiv] | [year]
- DOI/Link: [URL]

### One-Sentence Summary
[Language a first-year student can understand]

### Position Map
- Core problem solved?
- Baseline/comparison targets?
- Key cited works? (citation chain)
- Who cited it since? (impact tracking)

### Innovation Dissection
| Dimension | Assessment |
|-----------|-----------|
| Method Innovation | [new/improved/reused] |
| Experimental Innovation | [new dataset/SOTA/ablation] |
| Theoretical Innovation | [new theorem/new framework] |
| Engineering Innovation | [open source/reproducible] |

### S/A/B Grading
[Per SAB grading criteria]

### Key Takeaways
- Techniques learned:
- Room for improvement:
- Cross-domain connections:
- Cognitive book reference:

### Next Steps
[ ] Deep read
[ ] Trace citation chain
[ ] Try reproducing
[ ] Convert to content
```

