## Workflow A：文献输入→智能匹配与全景分析

> **用户说："帮我看看这篇论文" / 粘贴标题/DOI/PDF路径**

### A1：输入接收

支持以下输入格式：

| 输入类型 | 示例 | AI 自动执行 |
|---------|------|------------|
| 论文标题 | "Attention Is All You Need" | 自动搜索 arXiv + Google Scholar |
| DOI | "10.1038/s41586-023-06747-5" | 解析 DOI，获取完整元数据 |
| arXiv ID | "1706.03762" | 读取 arXiv 页面 |
| 本地PDF路径 | "D:/papers/xxx.pdf" | 读取 PDF，提取标题→搜索匹配文献 |
| 文献笔记 | "我读了一篇关于XXX的论文..." | 从描述中提取关键词→搜索 |

### A2：智能检索与匹配

```
1. 从用户输入提取关键信息（标题/作者/关键词）
2. 并行检索：
   - arXiv API（标题+关键词匹配）
   - 百大认知书籍库（看是否有相关认知心法）
   - 科研认知/readings/（看是否已有精读记录）
3. 输出文献全景卡片
```

### A3：文献全景卡片（输出格式）

```markdown
## 📋 文献全景卡片

### 基本信息
- 标题：[全文]
- 作者：[作者列表]
- 发表：[期刊/会议/arXiv] | [年份]
- DOI/链接：[URL]

### 一句话概括
[大一学生能懂的语言]

### 定位地图
本论文在领域中的位置：
- 它解決了什么核心问题？
- 它的 baseline/对比对象是谁？
- 它引用了哪些关键工作？（引用链）
