## Section 8: Workflow D — Writing Formula Library

### D1: Writing Technique Extraction

For each high-quality paper, extract:
- Title format analysis
- Abstract structure (sentence-by-sentence function)
- Introduction strategy (triangle/hamburger structure)
- Method section formulas
- Results presentation techniques
- Discussion strategies

### D2: Universal Writing Formulas

```
Abstract: "While [existing work] achieved [X], it suffers from [Y]. We propose [method], which [key innovation]. Results show [SOTA], outperforming [baseline] by [margin]."

Introduction: P1 (background + problem) -> P2 (related work + gap) -> P3 (our approach + novelty) -> P4 (contributions + paper structure)
```

### D3: Cognitive Book Integration

Auto-reference writing principles from the "100 Cognitive Books" collection when applicable.

---

## Section 9: Workflow E — Research Guidance

### E1: Stage-Aware Guidance

| Stage | Pain Point | Guidance |
|-------|-----------|----------|
| Topic Selection | "What to work on?" | Gap-based recommendations |
| Experiment Stuck | "Methods not working" | Similar method analysis |
| Writing Difficulty | "Can't organize" | Writing templates + formulas |
| Paper Rejected | "How to revise?" | Reviewer simulation + priorities |
| Preparing Defense | "How to present?" | Talk structure + key points |

### E2: Peer Review Simulation

Structured review with:
- Overall recommendation (Strong Accept / Accept / Weak Accept / Borderline / Weak Reject / Reject)
- Per-dimension scoring (Innovation / Method / Experiment / Writing / References)
- Mandatory fixes + suggested fixes
- "Reviewer mindset" analysis

