## Workflow D：学术写作心法库

> 从优秀论文中提炼可复用的写作方法论

### D1：从论文拆解写作结构

每次用户输入一篇高质量论文，自动拆解其写作技法：

```markdown
## 📝 写作技法拆解

### 标题分析
- 格式：[问题-方法-效果 / 方法-任务-贡献]
- 可复用的模式：[...]
- 字数：[X字]

### Abstract 结构
- 句子功能拆解：
  1. [背景/问题]：...
  2. [已有方法不足]：...
  3. [本文方法]：...
  4. [实验结果]：...
  5. [贡献声明]：...
- 节奏特点：[紧凑/铺垫型/开门见山]

### Introduction 套路
- 怎么引出问题：[从大场景到小问题]
- 怎么批评已有工作：[具体指出哪方面不够]
- 怎么定位自己的贡献：[和 baseline 的对比]
- 写作技巧：[倒三角结构/汉堡结构]

### Method 写作心法
- 公式化表达：[可摘录的句式]
- 图表设计策略：[图几最出彩/为什么]
- 数学公式的引入方式：[符号说明习惯]

### Result 呈现技巧
- 对比呈现：[表格/折线图/柱状图]
- 消融实验的设计：[哪些控制变量]
- 可视化：[做了什么可视化/为什么这样展示]

### Discussion 的高级策略
- 局限性的写法（不露怯地承认不足）：
- 未来工作的引导（暗示下一步发什么）：

### 这篇论文最值得学的一句话写作
[摘录+为什么这句话写得好]
```

### D2：论文各部分写作公式

```
### Abstract 万能公式
"While [现有工作] has achieved [X], it suffers from [Y] due to [Z].
In this paper, we propose [方法名], which [核心创新].
Specifically, [关键技术点].
Experimental results on [数据集] show that our method achieves [SOTA结果],
outperforming [baseline] by [提升幅度].
Our code is available at [链接]."

### Introduction 四段式
P1: [大背景] + [具体问题] + [为什么重要]
P2: [已有方法] + [为什么还不够]（引用关键文献）
P3: [本文方法] + [核心思路] + [两个关键创新点]
P4: [贡献总结] 1. 2. 3. + [论文组织]

### Related Work 写法策略
策略A：按主题分类（最常用）→ 适合综合性论文
策略B：按方法演进 → 适合方法创新论文
策略C：按矛盾对比 → 适合找空白论文
```

### D3：百大认知写作心法注入

每次写作指导时，自动关联百大认知书籍的对应心法：

| 写作环节 | 百大认知心法 | 应用方式 |
|---------|-------------|---------|
| 论文开头 | 「在当今…」不行 → 用具体问题切入 | 开头不要宏大叙事，从具体矛盾开始 |
| 方法设计 | 「系统框架不是束缚」→ 框架即护栏 | Method 写清楚设计逻辑，不是流水账 |
| 实验结果 | 「数据比形容词有力100倍」 | 用数字说话，用表格对比 |
| Discussion | 「追求快乐的过程本身就是痛苦的」 | 承认局限性的艺术 |

