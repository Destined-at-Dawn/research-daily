# Research Daily v2.2 — Research Decision Engine

> **Every day, 5 minutes. Know what to read and why.**

---

## Section 1: Error Handling Framework

### 1.1 Input Validation

Before processing any user input, validate against these patterns:

| Input Type | Validation Pattern | On Failure |
|-----------|-------------------|------------|
| arXiv ID | `^\d{4}\.\d{4,5}(v\d+)?$` | "This doesn't look like a valid arXiv ID. Did you mean the full ID (e.g., 2301.12345)?" |
| DOI | `^10\.\d{4,}/` | "This doesn't match DOI format. Try pasting the full DOI or the paper title instead." |
| URL | `^https?://` | "Please provide a valid URL starting with http:// or https://" |
| Paper Title | Length > 5 chars, not empty | "Please provide a paper title (at least 5 characters)." |
| PDF Path | Ends with `.pdf`, file exists | "File not found at this path. Please check the path and try again." |

### 1.2 External Service Failure Handling

```yaml
service_failures:
  arxiv_api:
    symptom: "No response or timeout from arXiv API"
    fallback_1: "Check local reading records (科研认知/readings/)"
    fallback_2: "Search cached paper metadata (outputs/)"
    fallback_3: "Ask user to paste paper abstract manually"
    user_message: "arXiv search temporarily unavailable. Checking local records first..."
    retry: 1 time after 5 seconds

  doi_resolution:
    symptom: "DOI resolver returns error"
    fallback: "Search by title keywords on arXiv"
    user_message: "DOI lookup failed. Searching by title instead..."

  pdf_reading:
    symptom: "PDF cannot be parsed"
    fallback: "Ask user to paste abstract or key sections"
    user_message: "Could not parse this PDF. Could you paste the abstract?"

  web_search:
    symptom: "Web search returns no results"
    fallback: "Broaden search terms, remove specificity"
    user_message: "No results for this search. Trying broader terms..."
```

### 1.3 Graceful Degradation Matrix

| Component | If It Fails | Degrade To | User Impact |
|-----------|------------|------------|-------------|
| arXiv API | Use cached data | Last known papers | Slightly stale results |
| S/A/B Grading | Use simplified criteria | Title + venue only | Less precise grading |
| Innovation Analysis | Skip missing dimensions | Available dimensions only | Partial analysis |
| Writing Formula | Skip cognitive book injection | Standalone analysis | No book references |
| Daily Report | Generate with available data | Partial report (marked) | Fewer papers |

### 1.4 User-Friendly Error Messages

Every error message must follow this format:

```
[What happened] + [Why it happened] + [What to do next]
```

Examples:
- "arXiv search returned no papers matching your keywords. This might mean the keywords are too specific. Try broadening your search terms, or paste the paper title directly."
- "The DOI you provided couldn't be resolved. This sometimes happens with very new papers. Try searching by title instead."

**Forbidden**: Technical jargon, stack traces, raw HTTP errors, "Error 404", "NullPointerException".

