## Section 6: Workflow B — Daily Report

### B0: Automation (Optional)
During onboarding, ask: "Want daily auto-generation?"
- Yes -> CronCreate: `0 8 * * *`, prompt: "generate daily report"
- No -> Manual trigger only

### B1-B5: Report Pipeline

B1: Collect papers from configured sources (arXiv/IEEE/SCI)
B2: Grade S/A/B with user profile weights
B3: Generate decision rationale for each grade
B4: Structure output into 6 modules
B5: Archive + bridge to reading system

### Report Modules

| Module | Content | Selection Criteria |
|--------|---------|-------------------|
| Today's Breakthrough | 1-2 items | High impact + direct relevance |
| Frontier Papers | 3-5 S/A-tier | Grading rationale included |
| Technical Insights | 1-2 items | Cross-paper connections |
| Tools & Code | 0-1 items | Reproducible/learnable |
| Tomorrow's Watch | Upcoming | Deadlines, conferences |
| Study Notes | Extractable | Learnable from papers |

