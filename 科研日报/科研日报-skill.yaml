## Section 3: Core Principles

### Principle 1: Input = Analysis
Any paper input (title/DOI/PDF/note) triggers immediate panoramic analysis — not just passive storage.

### Principle 2: Comparison Reveals Innovation
Innovation is discovered through structured comparison, not brainstorming.

### Principle 3: Reading -> Writing Closed Loop
Every paper must produce at least one usable output (technique, writing pattern, research direction).

---

## Section 4: First Run — Onboarding

> **First use: guide the user through 4 steps. Skipped on subsequent uses.**

### Step 1: Field Positioning
"What are your 1-3 core research directions?"
- Follow-up: "Any sub-fields you want to track closely?"
- Follow-up: "Any adjacent fields you want to monitor?"

### Step 2: Paper Baseline
"Share 1-3 papers that impressed you. What made them good?"
- On PDF input: Read -> extract -> analyze user's "impressive paper" traits -> encode as scoring weights
- On text input: Extract keywords and quality signals

### Step 3: Reading Mode
"What do you focus on? Pick 1-2:"
- Method Innovation / Experimental Results / Theoretical Depth / Engineering Value / Application Prospects

### Step 4: Innovation Focus
"What unsolved problems interest you? What should exist but doesn't?"

