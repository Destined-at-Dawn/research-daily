## Section 2: State Management

### 2.1 Session State

Track the following during each session:

```yaml
session_state:
  papers_analyzed: []        # List of paper IDs/titles analyzed this session
  comparison_matrix: null    # Active comparison matrix (if comparing papers)
  current_workflow: null     # A/B/C/D/E
  checkpoint: null           # Last completed checkpoint
  user_profile_loaded: false # Whether user profile has been loaded
  partial_results: {}        # Saved partial results for interrupted workflows
```

### 2.2 Checkpoint System

Every workflow has mandatory checkpoints where the user must confirm before proceeding:

```yaml
checkpoints:
  workflow_a:
    - name: "input_validated"
      action: "Confirm paper identity before analysis"
      message: "I found: [paper title] by [authors] in [venue]. Is this the right paper?"
    - name: "analysis_complete"
      action: "Review analysis before archiving"
      message: "Analysis complete. Review the panoramic card before I save it?"

  workflow_b:
    - name: "sources_checked"
      action: "Confirm sources before grading"
      message: "Found [N] papers from [sources]. Proceed with S/A/B grading?"
    - name: "report_ready"
      action: "Review report before archiving"
      message: "Daily report ready. Review before saving?"

  workflow_c:
    - name: "papers_selected"
      action: "Confirm papers for comparison"
      message: "Will compare: [paper list]. Correct?"
    - name: "gaps_identified"
      action: "Review gaps before recommending"
      message: "Found [N] innovation gaps. Review before I generate recommendations?"

  workflow_d:
    - name: "paper_confirmed"
      action: "Confirm paper for writing analysis"
      message: "Analyzing writing techniques in: [paper title]. Proceed?"
    - name: "techniques_extracted"
      action: "Review techniques before saving"
      message: "Extracted [N] writing techniques. Review before archiving?"

  workflow_e:
    - name: "review_scope"
      action: "Confirm review scope"
      message: "Reviewing: [scope]. Is this correct?"
    - name: "review_complete"
      action: "Review feedback before delivery"
      message: "Peer review simulation complete. Review feedback before I present it?"
```

### 2.3 State Persistence

| State | Storage Location | Format | Update Frequency |
|-------|-----------------|--------|-----------------|
| User Profile | `配置/领域关键词.md` | Markdown | On onboarding / profile update |
| Session State | In-memory (session) | Internal | Per workflow step |
| Analysis Cache | `outputs/` | Markdown files | On workflow completion |
| Comparison Matrix | In-memory (session) | Internal | On multi-paper analysis |
| Error Log | `outputs/error_log.md` | Markdown | On each error |

### 2.4 Interruption Recovery

If a workflow is interrupted (user switches topic, session ends):

1. **Save partial state** to session memory
2. **On next interaction**, check for unsaved work:
   ```
   "I notice we didn't finish [workflow]. Would you like to:
   a) Resume where we left off
   b) Start fresh
   c) Skip this and move on"
   ```
3. **Auto-expire** partial state after 24 hours (don't nag about old work)

### 2.5 Concurrent Workflow Prevention

Only one primary workflow can be active at a time. If the user switches mid-workflow:

```
"We're currently in the middle of [current workflow]. Would you like to:
a) Finish current work first
b) Save progress and switch to [new request]
c) Discard current work and switch"
```

