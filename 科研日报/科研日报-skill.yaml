## Workflow B：每日科研日报（保留 S/A/B 系统）

> 保留 v1.0 的完整日报生成能力，详见下方"日报模块定义"。

### B0：自动化配置（选做——安装时询问用户）

**目的**：让科研日报每天自动生成并推送给用户，无需每天手动说"生成今日日报"。

**AI 引导话术**（安装引导环节完成后询问）：

> **"附加问题：要不要我每天自动帮你生成科研日报？**
>
> 设置好以后，你每天早上打开工作区就能看到当天的论文精选，不用自己动手。
>
> - **不需要**——我每次手动说'生成今日日报'
> - **需要，每天早上 X 点**——比如每天早上 8 点自动生成
> - **需要，但不确定时间**——我推荐每天早上 8 点，你觉得呢？"

**用户确认后自动化配置流程**：

```
1. 用户说"好，每天早上8点"
2. AI 使用 CronCreate 工具创建每日定时任务：
   - cron: "0 8 * * *"（每天早上8点）
   - prompt: "生成今日科研日报"
   - recurring: true
   - durable: true（跨会话持久化）
3. 同时记录到 科研日报/配置/自动化配置.md
4. 告知用户已设置成功
```

**用户选择手动时**：
- 不创建定时任务
- 用户随时说"生成今日日报"→ 手动触发

**取消自动化**：
- 用户说"取消自动日报"→ 删除定时任务
- 用户说"改时间"→ 删除旧任务 + 创建新任务

### B1：信息采集
